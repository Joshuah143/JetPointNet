[project]
name = "jetpointnet"
version = "0.1.0"
description = "A deep learning approach to cell segmentation in the ATLAS detector"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "awkward>=2.7.4",
    "black>=25.1.0",
    "keras>=3.8.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.0",
    "numba>=0.61.0",
    "numpy>=2.0.2",
    "pandas>=2.2.3",
    "particle>=0.25.2",
    "plotly>=6.0.0",
    "pyarrow>=19.0.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "scikit-learn>=1.6.1",
    "tensorflow>=2.18.0",
    "tqdm>=4.67.1",
    "uproot>=5.5.1",
    "wandb>=0.19.6",
]

[dependency-groups]
cuda = [
    "tensorflow[and-cuda]>=2.18.0",
]
