[tool.poetry]
package-mode = false
name = "jetpointnet"
version = "0.1.0"
description = "A deep learning approach to cell segmentation in the ATLAS detector"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2.3"
awkward = "^2.6.9"
uproot = "^5.4.1"
scikit-learn = "^1.5.2"
wandb = "==0.19.1"
particle = "^0.25.2"
matplotlib = "^3.9.2"
plotly = "^5.24.1"
tqdm = "^4.66.5"
pyarrow = "^17.0.0"
atlas-mpl-style = "==0.24.1"
ipympl = "^0.9.4"
keras = "^3.6.0"
tensorflow = "^2.17.1"
numpy = "*"
notebook = "^7.3.2"
beautifulsoup4 = "==4.13.0b2"
pre-commit = "^4.0.1"
pytest = "^8.3.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
