repos:
  - repo: local
    hooks:
      - id: run-tests
        name: Run Tests
        entry: pytest
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # same as `make format` but uses precompiled black
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.8.0
    hooks:
      - id: black