variables:
  UV_VERSION: 0.5
  PYTHON_VERSION: 3.12
  BASE_LAYER: bookworm-slim
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy

test:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  before_script:
    - apt-get update
    - apt-get install -y git # required for git hash in tests
  script:
    - uv run pytest --cov=prod --cov-report=xml --cov-report=html --junitxml=test-results.xml
    - uv run coverage report
  artifacts:
    when: always
    paths:
      - htmlcov/             # Store HTML coverage report
      - coverage.xml         # XML coverage report for GitLab parsing
      - test-results.xml     # JUnit-style test report
    reports:
      junit: test-results.xml  # Enables GitLab Test Report UI
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml  # Enables GitLab Coverage Visualization
    expire_in: 7 days  # Keep test reports for 7 days
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
